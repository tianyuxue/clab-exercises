id: 00_bestpath
title:
  en: The best-path decision order
  zh: BGP 先比什么？
brief: {en: "Answer the question to continue: in what order does BGP compare path attributes?", zh: "先回答几个问题再往下走：BGP 按什么顺序比较路径属性？哪些属性必须带？哪个属性不跨 eBGP？"}
type: quiz
difficulty: 3
hints:
  - en: LOCAL_PREF is compared before AS_PATH; MED is near the end.
    zh: LOCAL_PREF 排在 AS_PATH 前面；MED 接近最后。
questions:
  - prompt:
      en: Which comparison comes earliest in BGP best-path selection?
      zh: BGP 选路时，最先比较的是哪一项？
    multiple: false
    options:
      - text: {en: Weight, zh: Weight}
        correct: true
        explanation:
          en: Weight is a Cisco/FRR-specific value (not defined in RFC 4271); it is local to the router and checked first.
          zh: Weight 是 Cisco/FRR 自己的值，RFC 4271 没有定义。它只在本机有效，排在最前面。
      - text: {en: AS_PATH length, zh: AS_PATH 长度}
        correct: false
        explanation:
          en: AS_PATH is compared after LOCAL_PREF.
          zh: AS_PATH 要等 LOCAL_PREF 比完才轮到。
      - text: {en: Router-id, zh: Router-id}
        correct: false
        explanation:
          en: Router-id is a late tie-breaker.
          zh: Router-id 是最后的平局项，前面都打平才看它。
  - prompt:
      en: Which attributes are well-known mandatory?
      zh: 下面哪些是 well-known mandatory 属性？
    multiple: true
    options:
      - text: {en: ORIGIN, zh: ORIGIN}
        correct: true
        explanation:
          en: Required when NLRI is present.
          zh: 只要 UPDATE 带了 NLRI，ORIGIN 就必须出现。
      - text: {en: AS_PATH, zh: AS_PATH}
        correct: true
        explanation:
          en: Required when NLRI is present.
          zh: AS_PATH 也是必带项，用来记录经过的 AS。
      - text: {en: NEXT_HOP, zh: NEXT_HOP}
        correct: true
        explanation:
          en: Required when NLRI is present.
          zh: NEXT_HOP 必带，告诉对端下一跳去哪。
      - text: {en: MED, zh: MED}
        correct: false
        explanation:
          en: MED is optional non-transitive.
          zh: MED 是 optional non-transitive：可选，而且不往下一个 AS 传。
  - prompt:
      en: Which attribute is NOT carried across an eBGP session?
      zh: 哪个属性不会跨 eBGP 会话传递？
    multiple: false
    options:
      - text: {en: LOCAL_PREF, zh: LOCAL_PREF}
        correct: true
        explanation:
          en: LOCAL_PREF is local and only sent to iBGP peers.
          zh: LOCAL_PREF 只在本 AS 内传，eBGP 对等体收不到。
      - text: {en: AS_PATH, zh: AS_PATH}
        correct: false
        explanation:
          en: AS_PATH is mandatory and crosses every eBGP session.
          zh: AS_PATH 是必带属性，每过一次 eBGP 都会加上对方的 AS 号。
      - text: {en: NEXT_HOP, zh: NEXT_HOP}
        correct: false
        explanation:
          en: NEXT_HOP is mandatory and present in eBGP UPDATEs.
          zh: NEXT_HOP 是必带属性，eBGP 的 UPDATE 里一定有。
