id: 01_localpref
title:
  en: Prefer a path with LOCAL_PREF
  zh: 用 LOCAL_PREF 选择路径
brief: {en: "r1 reaches 10.2.2.0/24 via r3. Make it prefer the path via r2 by setting LOCAL_PREF on r2's routes.", zh: "r1 当前经 r3 到达 10.2.2.0/24。给 r2 的入向路由设 LOCAL_PREF，让 r1 改走 r2。"}
type: config-fix
difficulty: 3
timeout: 60s
hints:
  - en: Check r1's choice with `ip route get 10.2.2.100`.
    zh: 用 `ip route get 10.2.2.100` 看 r1 的选择。
  - en: LOCAL_PREF is set on inbound routes, e.g. a route-map with `set local-preference 200`.
    zh: LOCAL_PREF 设在入向路由上，例如 route-map 里 `set local-preference 200`。
files:
  - source: r1/r1.sh
    node: r1
    dest: /root/r1.sh
  - source: r2/r2.sh
    node: r2
    dest: /root/r2.sh
  - source: r3/r3.sh
    node: r3
    dest: /root/r3.sh
reload:
  - node: r1
    cmd: "sh /root/r1.sh"
  - node: r2
    cmd: "sh /root/r2.sh"
  - node: r3
    cmd: "sh /root/r3.sh"
assertions:
  - name:
      en: r1 selects the path via r2
      zh: r1 选择经 r2 的路径
    type: exec
    layer: control-plane
    node: r1
    cmd: "ip route get 10.2.2.100"
    wait: 40s
    match:
      stdout:
        contains: "10.1.12.2"
    hint:
      en: Set LOCAL_PREF 200 on routes learned from 10.1.12.2.
      zh: 对从 10.1.12.2 学到的路由设置 LOCAL_PREF 200。
  - name:
      en: h1 can reach h2
      zh: h1 能到达 h2
    type: exec
    layer: data-plane
    node: h1
    cmd: "ping -c 2 -W 2 10.2.2.100"
    wait: 20s
    match:
      exit_code: 0
    hint: {en: Ensure forwarding works and the path is up., zh: 确保转发生效、路径可达。}
