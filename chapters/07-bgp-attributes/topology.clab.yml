name: clablings-bgp-attributes
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv4.conf.all.rp_filter: "0"
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv4.conf.all.rp_filter: "0"
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv4.conf.all.rp_filter: "0"
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    sw:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: switch
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
    h1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.2/24 dev eth1
        - ip route replace 10.2.2.0/24 via 10.0.1.1 dev eth1
    h2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip link set eth1 up
        - ip addr add 10.2.2.100/24 dev eth1
        - ip route replace 10.0.1.0/24 via 10.2.2.2 dev eth1
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r2:eth2", "sw:eth1"]
    - endpoints: ["r3:eth2", "sw:eth2"]
    - endpoints: ["sw:eth3", "h2:eth1"]
