- title: RFC 4271 — Path Attributes
  section: "Path Attributes"
  kind: required
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-5
  intro:
    en: The attribute model (well-known/optional, transitive/non-transitive) behind the comparison order.
    zh: 支撑比较顺序的属性模型（well-known/optional、transitive/non-transitive）。
  question:
    en: Which attributes are well-known mandatory?
    zh: 哪些属性是 well-known mandatory？

- title: RFC 4271 — Decision Process
  section: "Decision Process"
  kind: required
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-9.1
  intro:
    en: The decision-process steps you exercise when steering r1.
    zh: 你在引导 r1 选路时所对应的决策过程步骤。
  question:
    en: Where do LOCAL_PREF and AS_PATH sit in the decision order?
    zh: LOCAL_PREF 与 AS_PATH 在决策顺序中处于哪一步？

- title: RFC 4271 — MULTI_EXIT_DISC
  section: "MULTI_EXIT_DISC"
  kind: optional
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-5.1.4
  intro:
    en: Why MED is only meaningful between entry points to the same neighboring AS.
    zh: 为什么 MED 只对同一邻居 AS 的多个入口点有意义。
  question:
    en: To whom is MED intended to be a hint?
    zh: MED 意图提示的对象是谁？
