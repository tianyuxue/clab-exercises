name: clablings-vlan
topology:
  nodes:
    h1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip link set eth1 up
    sw:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
    h2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set eth1 up
  links:
    - endpoints: ["h1:eth1", "sw:eth1"]
    - endpoints: ["sw:eth2", "h2:eth1"]
