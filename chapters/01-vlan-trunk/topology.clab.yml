name: clablings-vlan
topology:
  nodes:
    sw1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: switch
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
    sw2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: switch
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
    h1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip addr add 10.0.10.1/24 dev eth1
        - ip link set eth1 up
    h2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip addr add 10.0.10.2/24 dev eth1
        - ip link set eth1 up
    h3:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip addr add 10.0.10.3/24 dev eth1
        - ip link set eth1 up
    h4:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: host
      exec:
        - ip addr add 10.0.20.1/24 dev eth1
        - ip link set eth1 up
  links:
    - endpoints: ["h1:eth1", "sw1:eth1"]
    - endpoints: ["h2:eth1", "sw1:eth2"]
    - endpoints: ["sw1:eth3", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "h3:eth1"]
    - endpoints: ["sw2:eth3", "h4:eth1"]
