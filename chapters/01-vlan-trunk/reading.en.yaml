- title: Linux bridge — What does a bridge do?
  section: "What does a bridge do?"
  kind: required
  url: https://docs.kernel.org/networking/bridge.html#what-does-a-bridge-do
  intro:
    en: Explains how a bridge learns MAC addresses and floods broadcasts/unknown unicast, which is exactly why a flat network leaks traffic.
    zh: 说明网桥如何学习 MAC、泛洪广播/未知单播——这正是扁平网络泄漏流量的原因。
  question:
    en: When does a bridge flood a frame to every port, and when does it forward to one port?
    zh: 网桥什么时候把帧泛洪到所有端口？什么时候只转到一个端口？

- title: Linux bridge — VLAN
  section: "VLAN"
  kind: required
  url: https://docs.kernel.org/networking/bridge.html#vlan
  intro:
    en: How the Linux bridge implements 802.1Q VLAN filtering; "pvid untagged" is how you configure an access port.
    zh: Linux 网桥如何实现 802.1Q VLAN filtering；"pvid untagged" 就是配置 access 端口的写法。
  question:
    en: What do pvid and untagged each control for incoming and outgoing frames?
    zh: pvid 与 untagged 分别控制入向和出向帧的什么行为？
