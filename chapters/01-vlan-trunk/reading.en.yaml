- title: Linux bridge — Introduction
  section: "Introduction"
  kind: required
  url: https://docs.kernel.org/networking/bridge.html#introduction
  intro:
    en: Defines what a bridge is and how it connects several network segments into one logical Ethernet network — the reason a flat network is a single broadcast domain.
    zh: 说明什么是网桥、它如何把多段网络连成一个逻辑以太网——这正是扁平网络只有一个广播域的原因。
  question:
    en: What does a bridge connect, and at which layer does it forward frames?
    zh: 网桥连接的是什么？它在哪一层转发帧？

- title: Linux bridge — VLAN
  section: "VLAN"
  kind: required
  url: https://docs.kernel.org/networking/bridge.html#vlan
  intro:
    en: How the Linux bridge implements 802.1Q VLAN filtering; "pvid untagged" is how you configure an access port.
    zh: Linux 网桥如何实现 802.1Q VLAN filtering；"pvid untagged" 就是配置 access 端口的写法。
  question:
    en: What do pvid and untagged each control for incoming and outgoing frames?
    zh: pvid 与 untagged 分别控制入向和出向帧的什么行为？
