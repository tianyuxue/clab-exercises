id: 01-vlan-trunk
title:
  en: VLAN and Trunk
  zh: VLAN 与 Trunk
difficulty: 2
tags: [l2, vlan, trunk, switching]
estimated_minutes: 60
prerequisites: []
objectives:
  en:
    - Explain why a switch needs a VLAN identity per frame, and how PVID provides it on host links
    - Explain why a shared switch-to-switch link must tag frames, and what native VLAN is for
    - Observe untagged vs tagged frames on access and trunk links, and fix VLAN misconfigurations
  zh:
    - 解释交换机为何需要"每帧的 VLAN 身份"，以及 PVID 如何在主机侧提供它
    - 解释交换机之间的共享链路为何必须打标签，以及 native VLAN 是做什么的
    - 在 access 与 trunk 链路上观察无标签/带标签帧，并修复 VLAN 配置错误
topology: topology.clab.yml
deploy:
  timeout: 120s
