id: 01_access
title:
  en: Access ports carry untagged frames
  zh: Access 端口承载无标签帧
brief: {en: "h1 and h2 are in the same subnet (10.0.10.0/24) but cannot reach each other. Fix the access VLANs so they can, then watch the frames on the wire.", zh: "h1 和 h2 在同一个网段（10.0.10.0/24），却互相 ping 不通。把两个 access 口的 VLAN 配成一样，再抓包看看帧上有没有标签。"}
type: config-fix
difficulty: 2
timeout: 40s
hints:
  - en: A host NIC does not speak 802.1Q, so the switch must place its untagged frames into a VLAN using the port's PVID.
    zh: 主机网卡不认识 802.1Q，进来的裸帧只能靠端口 PVID 分 VLAN。
  - en: Check both ports' PVID with `bridge vlan show`; they must match.
    zh: 用 `bridge vlan show` 看看两个口的 PVID，得一样。
files:
  - source: h2/h2.sh
    node: h2
    dest: /root/h2.sh
  - source: sw1/access.sh
    node: sw1
    dest: /root/access.sh
reload:
  - node: h2
    cmd: "sh /root/h2.sh"
  - node: sw1
    cmd: "pkill -x tcpdump 2>/dev/null; rm -f /tmp/cap.pcap; setsid tcpdump -U -i eth1 -w /tmp/cap.pcap >/dev/null 2>&1 </dev/null &"
  - node: sw1
    cmd: "sh /root/access.sh"
assertions:
  - name:
      en: h1 can ping h2
      zh: h1 能 ping 通 h2
    type: exec
    layer: data-plane
    node: h1
    cmd: "ping -c 3 -W 2 10.0.10.2"
    wait: 20s
    match:
      exit_code: 0
    hint:
      en: Both access ports must use the same PVID.
      zh: 两个 access 口的 PVID 得一样。
  - name:
      en: the access link carries host traffic untagged
      zh: access 链路上看不到 VLAN 标签
    type: exec
    layer: data-plane
    node: sw1
    cmd: "sh -c \"tcpdump -r /tmp/cap.pcap -e -nn 2>/dev/null > /tmp/c.txt; grep -q '10.0.10' /tmp/c.txt && ! grep -q vlan /tmp/c.txt\""
    wait: 10s
    match:
      exit_code: 0
    hint:
      en: On an access port the switch adds/strips the tag, so the host link shows the host's traffic with no VLAN tag.
      zh: Access 口的标签由交换机负责加和去，主机这边看到的就是不带标签的原始帧。
