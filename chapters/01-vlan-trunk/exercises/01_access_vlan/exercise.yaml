id: 01_access_vlan
title:
  en: Fix access VLANs
  zh: 修复 access VLAN
type: config-fix
difficulty: 2
timeout: 30s
hints:
  - en: Check the PVID of both bridge ports with `bridge vlan show`.
    zh: 用 `bridge vlan show` 查看两个网桥端口的 PVID。
  - en: Same subnet is not enough; the access VLANs must match.
    zh: 同网段还不够，access VLAN 必须一致。
files:
  - source: sw/vlan.sh
    node: sw
    dest: /root/vlan.sh
reload:
  - node: sw
    cmd: "sh /root/vlan.sh"
assertions:
  - name:
      en: vlan.sh has the sentinel removed
      zh: vlan.sh 已移除哨兵
    type: file
    source: sw/vlan.sh
  - name:
      en: eth2 is in VLAN 10
      zh: eth2 属于 VLAN 10
    type: exec
    layer: control-plane
    node: sw
    cmd: "bridge vlan show dev eth2"
    wait: 5s
    match:
      stdout:
        contains: "10"
    hint:
      en: Both access ports must use the same VID.
      zh: 两个 access 端口必须使用相同的 VID。
  - name:
      en: h1 can ping h2
      zh: h1 能 ping 通 h2
    type: exec
    layer: data-plane
    node: h1
    cmd: "ping -c 2 -W 2 10.0.1.2"
    wait: 15s
    match:
      exit_code: 0
    hint:
      en: With different PVIDs, ARP is isolated even on the same subnet.
      zh: PVID 不同时，即使同网段，ARP 也被隔离。
