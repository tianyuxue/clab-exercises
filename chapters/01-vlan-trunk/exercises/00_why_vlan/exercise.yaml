id: 00_why_vlan
title:
  en: Why VLANs?
  zh: 为什么需要 VLAN？
brief: {en: "Answer the question to continue: what does a VLAN isolate, and what does an 802.1Q tag carry?", zh: "先回答两个问题再往下走：VLAN 到底隔离了什么？802.1Q 标签里又带了哪些信息？"}
type: quiz
difficulty: 1
hints:
  - en: Think about what a switch does with an unknown destination MAC.
    zh: 想想看：交换机收到一个目的 MAC 不认识的帧，会怎么处理？
questions:
  - prompt:
      en: What does a VLAN primarily isolate?
      zh: VLAN 主要隔离的是什么？
    multiple: false
    options:
      - text: {en: The broadcast domain, zh: 广播域}
        correct: true
        explanation:
          en: A VLAN bounds how far broadcasts and unknown unicast are flooded.
          zh: VLAN 管的是广播和未知单播能泛洪到多远。
      - text: {en: The collision domain, zh: 冲突域}
        correct: false
        explanation:
          en: Collision domains are bounded by bridges/ports, not VLANs.
          zh: 冲突域是网桥和端口划出来的，跟 VLAN 没关系。
      - text: {en: The routing table, zh: 路由表}
        correct: false
        explanation:
          en: Routing between VLANs is a separate (L3) concern.
          zh: VLAN 间路由是三层的事。
  - prompt:
      en: Which statements about the 802.1Q tag are true?
      zh: 关于 802.1Q 标签，下列哪些说法正确？
    multiple: true
    options:
      - text: {en: It carries a 12-bit VLAN ID, zh: 标签中包含 12 位 VLAN ID}
        correct: true
        explanation:
          en: The VID is 12 bits, so 0-4095.
          zh: VID 占 12 位，所以范围是 0–4095。
      - text: {en: It carries a 3-bit priority (PCP), zh: 标签中包含 3 位优先级（PCP）}
        correct: true
        explanation:
          en: PCP enables L2 prioritisation.
          zh: PCP 用来做二层优先级。
      - text: {en: Access ports tag every outgoing frame, zh: Access 端口会对每个出帧打标签}
        correct: false
        explanation:
          en: Access ports send untagged frames; trunks tag them.
          zh: Access 口发出去的帧不带标签；打标签的是 Trunk 口。
      - text: {en: It is inserted after the source MAC, zh: 标签插在源 MAC 之后}
        correct: true
        explanation:
          en: The tag sits between the source MAC and the EtherType.
          zh: 标签就夹在源 MAC 和 EtherType 之间。
