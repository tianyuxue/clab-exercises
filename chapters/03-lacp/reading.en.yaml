- title: Linux bonding — LACP (802.3ad) mode
  section: "3.7 Configuring LACP for 802.3ad mode in a more secure way"
  kind: required
  url: https://docs.kernel.org/networking/bonding.html#configuring-lacp-for-802-3ad-mode-in-a-more-secure-way
  intro:
    en: How 802.3ad/LACP mode works and what both ends must agree on; the mechanism is the same as on a switch LAG.
    zh: 讲 802.3ad/LACP 模式怎么跑，两端要对上哪些参数。交换机上的 LAG 是同一套逻辑。
  question:
    en: Which parameters must match between the two ends for a link to join the bundle?
    zh: 两端有哪些参数必须对上，一条链路才能进捆绑？

- title: Linux bonding — Querying Bonding Configuration
  section: "4 Querying Bonding Configuration"
  kind: optional
  url: https://docs.kernel.org/networking/bonding.html#querying-bonding-configuration
  intro:
    en: How to read the live state of a bundle and its members from the kernel (the Linux analogue of `show lag`).
    zh: 从内核里读出捆绑和成员的实时状态，相当于 Linux 版的 `show lag`。
  question:
    en: Where do you look to see whether a member is actually part of the bundle?
    zh: 在哪里能看出一个成员到底进没进捆绑？
