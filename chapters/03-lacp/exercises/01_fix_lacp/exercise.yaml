id: 01_fix_lacp
title:
  en: Bring the LAG up
  zh: 把 LAG 拉起来
brief: {en: "lag1 is down because both sides are LACP PASSIVE. Bring it up.", zh: "lag1 起不来，因为两端都停在 LACP PASSIVE。把它拉起来。"}
type: config-fix
difficulty: 3
timeout: 60s
hints:
  - en: Check `sr_cli show lag` for oper-down-reason.
    zh: 先看 `sr_cli show lag` 里的 oper-down-reason，原因会直接告诉你缺什么。
  - en: Two PASSIVE sides never send LACP frames; make one side ACTIVE.
    zh: 两侧都 PASSIVE，就没人发 LACP 帧；把一侧改成 ACTIVE。
files:
  - source: srl1/lag.sh
    node: srl1
    dest: /root/lag.sh
  - source: srl2/lag.sh
    node: srl2
    dest: /root/lag.sh
reload:
  - node: srl2
    cmd: "sh /root/lag.sh"
  - node: srl1
    cmd: "sh /root/lag.sh"
assertions:
  - name:
      en: lag1 is up with both members
      zh: lag1 起来，两个成员都在组里
    type: exec
    layer: control-plane
    node: srl1
    cmd: "sr_cli -d \"show lag\""
    wait: 30s
    match:
      stdout:
        contains: "lag1 is up"
    hint:
      en: LACP must negotiate; make srl1 active.
      zh: LACP 得先谈成；把 srl1 改成 active。
  - name:
      en: can ping the peer over the LAG
      zh: 能经 LAG ping 通对端
    type: exec
    layer: data-plane
    node: srl1
    cmd: "sr_cli -d \"ping -c 2 10.0.0.2 network-instance default\""
    wait: 30s
    match:
      exit_code: 0
    hint:
      en: Verify the LAG is up and in the default network-instance first.
      zh: 先确认 LAG 已经起来，并且接进了 default network-instance。
