  zh:
    - 说出四种 BGP 报文类型并读懂报文头部
    - 解释前缀为何可能未被通告（FRR ebgp-requires-policy）
    - 在链路上解构 UPDATE 的 AS_PATH，并读懂 NOTIFICATION 错误码
topology: topology.clab.yml
deploy:
  timeout: 180s
