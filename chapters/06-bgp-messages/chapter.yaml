id: 06-bgp-messages
title:
  en: "BGP Messages: UPDATE and NOTIFICATION"
  zh: "BGP 报文：UPDATE 与 NOTIFICATION"
difficulty: 3
tags: [l3, bgp, messages, routing]
estimated_minutes: 50
prerequisites: [05-bgp-basics]
objectives:
  en:
    - Name the four BGP message types and read the 19-octet header
    - Explain why a prefix may never be advertised when FRR's ebgp-requires-policy is on
    - Decode AS_PATH and NLRI from an UPDATE on the wire, and read NOTIFICATION error codes
  zh:
    - 说出四种 BGP 报文各自负责什么，并读懂每条报文开头的 19 字节头部
    - 解释邻居已经 Established、前缀却没发出去的原因（FRR 的 ebgp-requires-policy）
    - 在链路上拆开一条 UPDATE，读出 AS_PATH 和 NLRI，再看懂 NOTIFICATION 错误码
topology: topology.clab.yml
deploy:
  timeout: 180s
