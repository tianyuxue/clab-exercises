- title: RFC 4271 — Message Header Format
  section: "Message Header Format"
  kind: required
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-4.1
  intro:
    en: The 19-octet header you read first in every captured message.
    zh: 抓包时，每条报文最前面都是这 19 字节；先读它，才知道后面是什么。
  question:
    en: What is the marker set to, and does Length include the header?
    zh: marker 填的是什么？Length 把头部算进去了吗？

- title: RFC 4271 — UPDATE Message Format
  section: "UPDATE Message Format"
  kind: required
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-4.3
  intro:
    en: The field layout of the UPDATE whose AS_PATH and NLRI you decode in this chapter.
    zh: 本章要拆的 UPDATE 长什么样，AS_PATH 和 NLRI 各自在哪个位置。
  question:
    en: How are ORIGIN, AS_PATH, and NEXT_HOP carried?
    zh: ORIGIN、AS_PATH、NEXT_HOP 分别怎么带？

- title: RFC 4271 — NOTIFICATION Message Format
  section: "NOTIFICATION Message Format"
  kind: optional
  url: https://www.rfc-editor.org/rfc/rfc4271.html#section-4.5
  intro:
    en: The error codes, including the Cease (6) you capture on teardown.
    zh: 错误码清单，也包括主动拆链时抓到的 Cease（6）。
  question:
    en: What does error code 6 mean?
    zh: 错误码 6 表示什么？
