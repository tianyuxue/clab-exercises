id: 02_aspath
title:
  en: Read the AS_PATH on the wire
  zh: 在链路上读 AS_PATH
brief: {en: "Make r1 prepend its AS number twice on the outbound UPDATE, so the captured AS_PATH shows 65001,65001,65001.", zh: "让 r1 在出向 UPDATE 上把本 AS 号 prepend 两次，使抓到的 AS_PATH 变成 65001,65001,65001。"}
type: config-fix
difficulty: 3
timeout: 60s
hints:
  - en: Use a route-map named `PREPEND` with `set as-path prepend 65001 65001`, applied outbound.
    zh: 建一条名为 `PREPEND` 的 route-map，写 `set as-path prepend 65001 65001`，应用在出向。
  - en: Reset the session so the new UPDATE is sent (`clear bgp *`).
    zh: 改完重置会话，让新的 UPDATE 发出去（`clear bgp *`）。
files:
  - source: sniff/recapture.sh
    node: sniff
    dest: /root/recapture.sh
  - source: r1/aspath.sh
    node: r1
    dest: /root/aspath.sh
  - source: r2/aspath.sh
    node: r2
    dest: /root/aspath.sh
reload:
  - node: sniff
    cmd: "sh /root/recapture.sh"
  - node: r1
    cmd: "sh /root/aspath.sh"
  - node: r2
    cmd: "sh /root/aspath.sh"
assertions:
  - name:
      en: the session is Established
      zh: 会话已经 Established
    type: exec
    layer: control-plane
    node: r1
    cmd: "vtysh -c 'show bgp summary json'"
    wait: 40s
    match:
      json: "$.ipv4Unicast.peers.*.state"
      equals: "Established"
    hint: {en: The session must be up before its UPDATE can be observed., zh: 先让会话起来，才谈得上观察它的 UPDATE。}
  - name:
      en: the captured UPDATE carries a repeated AS_PATH
      zh: 抓到的 UPDATE 带着重复的 AS_PATH
    type: exec
    layer: control-plane
    node: sniff
    cmd: "tshark -r /tmp/bgp.pcap -Y 'bgp.type==2 && ip.src==10.1.12.1' -T fields -e bgp.update.path_attribute.as_path_segment.as4 | grep -v '^$' | tail -1"
    wait: 10s
    match:
      stdout:
        contains: "65001,65001"
    hint:
      en: Add `set as-path prepend 65001 65001` outbound on r1, then `clear bgp *`.
      zh: 在 r1 上加出向 `set as-path prepend 65001 65001`，然后 `clear bgp *`。
