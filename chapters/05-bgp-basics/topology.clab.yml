name: clablings-bgp-basics
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    sniff:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: sniffer
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - sh -c "setsid tcpdump -U -i any -w /tmp/bgp.pcap tcp port 179 >/dev/null 2>&1 </dev/null &"
  links:
    - endpoints: ["r1:eth1", "sniff:eth1"]
    - endpoints: ["sniff:eth2", "r2:eth1"]
