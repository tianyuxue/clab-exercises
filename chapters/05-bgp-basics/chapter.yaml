id: 05-bgp-basics
title:
  en: BGP basics — session establishment
  zh: "BGP 入门：一条会话是怎么建起来的"
difficulty: 2
tags: [l3, bgp, routing, fsm]
estimated_minutes: 45
prerequisites: [04-mlag]
objectives:
  en:
    - Explain the BGP finite state machine and how a session reaches Established
    - Read the OPEN message fields that two peers negotiate
    - Bring an eBGP session up by fixing the neighbor configuration
  zh:
    - 搞清楚 BGP 会话要经过哪些状态，怎样才算走到 Established
    - 读懂两端在 OPEN 里交换的字段，尤其是 AS 号和 Hold Time
    - 修好邻居配置，让一条 eBGP 会话真正起来
topology: topology.clab.yml
deploy:
  timeout: 180s
