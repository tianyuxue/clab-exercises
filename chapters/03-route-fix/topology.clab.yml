name: clablings-route-fix
topology:
  nodes:
    r1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.2.1/30 dev eth1
        - ip link set eth1 up
    r2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.2.2/30 dev eth1
        - ip link set eth1 up
        - ip addr add 10.255.0.2/32 dev lo
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
