id: 01_route_fix
title: 修复缺失的静态路由
type: config-fix
hints:
  - r1 与 r2 通过 10.0.2.0/30 直连，下一跳应是对端地址。
  - 修改 routes.sh 后删掉 I AM NOT DONE 才会触发验证。
timeout: 30s
files:
  - source: r1/routes.sh
    node: r1
    dest: /root/routes.sh
reload:
  - node: r1
    cmd: "sh /root/routes.sh"
assertions:
  - name: routes.sh 已移除哨兵
    type: file
    source: r1/routes.sh
  - name: r1 可到达 r2 环回
    type: exec
    layer: data-plane
    node: r1
    cmd: "ping -c 2 -W 2 10.255.0.2"
    match:
      exit_code: 0
    hint: 检查 routes.sh 中的下一跳是否为 10.0.2.2。
