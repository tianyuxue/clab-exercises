name: clablings-bgp-troubleshoot
topology:
  nodes:
    edge:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    core:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      exec:
        - ip link set eth1 up
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    ext:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      group: router
      exec:
        - ip link set eth1 up
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf
    sniff:
      kind: linux
      image: nicolaka/netshoot:v0.13
      group: sniffer
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
  links:
    - endpoints: ["edge:eth1", "core:eth1"]
    - endpoints: ["edge:eth2", "sniff:eth1"]
    - endpoints: ["sniff:eth2", "ext:eth1"]
