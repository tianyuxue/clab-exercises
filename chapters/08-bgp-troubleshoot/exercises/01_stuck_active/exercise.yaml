id: 01_stuck_active
title:
  en: The neighbor that never comes up
  zh: 邻居为什么一直停在 Active
brief: {en: "edge has an eBGP neighbor stuck in Active. Make the session reach Established.", zh: "edge 的 eBGP 邻居一直停在 Active，会话到不了 Established。先看清是地址问题，再把邻居修好。"}
type: config-fix
difficulty: 3
timeout: 60s
hints:
  - en: "`show bgp summary` shows the neighbor in the Active/Connect column."
    zh: "`show bgp summary` 里，这个邻居待在 Active/Connect 一列，前缀数一直是 0。"
  - en: Check the configured neighbor address against the link subnet.
    zh: 拿配置里的邻居地址和链路网段 `10.1.12.0/30` 对一下。
files:
  - source: edge/edge.sh
    node: edge
    dest: /root/edge.sh
  - source: core/core.sh
    node: core
    dest: /root/core.sh
  - source: ext/ext.sh
    node: ext
    dest: /root/ext.sh
reload:
  - node: edge
    cmd: "sh /root/edge.sh"
  - node: core
    cmd: "sh /root/core.sh"
  - node: ext
    cmd: "sh /root/ext.sh"
assertions:
  - name:
      en: edge sees the eBGP peer as Established
      zh: edge 的 eBGP 邻居进入 Established
    type: exec
    layer: control-plane
    node: edge
    cmd: "vtysh -c 'show bgp summary json'"
    wait: 40s
    match:
      json: "$.ipv4Unicast.peers.*.state"
      equals: "Established"
    hint:
      en: Correct the neighbor address to 10.1.12.2, then clear the session.
      zh: 把邻居地址改成 10.1.12.2，再重置会话。
  - name:
      en: edge has two peers configured
      zh: edge 上保留两个邻居
    type: exec
    layer: control-plane
    node: edge
    cmd: "vtysh -c 'show bgp summary json'"
    wait: 5s
    match:
      json: "$.ipv4Unicast.peerCount"
      equals: "2"
    hint:
      en: Remove the wrong neighbor and add 10.1.12.2; do not just delete it.
      zh: 删掉错误邻居后，别忘了补上 10.1.12.2；只删不补过不了。
