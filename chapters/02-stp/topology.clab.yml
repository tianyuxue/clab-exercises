name: clablings-stp
topology:
  nodes:
    sw1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip link add br0 type bridge stp_state 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
    sw2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip link add br0 type bridge stp_state 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set dev br0 type bridge priority 4096
    sw3:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip link add br0 type bridge stp_state 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
    h1:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip link set eth1 up
    h2:
      kind: linux
      image: nicolaka/netshoot:v0.13
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set eth1 up
  links:
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "sw3:eth1"]
    - endpoints: ["sw3:eth2", "sw1:eth2"]
    - endpoints: ["sw1:eth3", "h1:eth1"]
    - endpoints: ["sw2:eth3", "h2:eth1"]
