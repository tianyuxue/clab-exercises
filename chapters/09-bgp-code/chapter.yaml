id: 09-bgp-code
title:
  en: Write a minimal BGP speaker in C
  zh: 用 C 写一个最小 BGP speaker
difficulty: 5
tags: [l3, bgp, code, tcp]
estimated_minutes: 90
prerequisites: [08-bgp-troubleshoot]
objectives:
  en:
    - Speak enough BGP to form a session with FRR (OPEN and KEEPALIVE)
    - Implement the byte layout of the BGP message header and OPEN
    - Advertise a prefix with a hand-built UPDATE
  zh:
    - 用 OPEN 和 KEEPALIVE 把会话拉到 Established，让 FRR 认下这个邻居
    - 按字节布局拼出 BGP 报文头和 OPEN，长度与字节序都不能偏
    - 手工构造一条 UPDATE，把 192.0.2.0/24 通告给 r1
topology: topology.clab.yml
deploy:
  timeout: 180s
