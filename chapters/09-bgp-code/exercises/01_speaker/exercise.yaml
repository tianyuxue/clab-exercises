id: 01_speaker
title:
  en: A minimal BGP speaker
  zh: 让 FRR 认下你的 BGP speaker
brief: {en: "Implement OPEN, KEEPALIVE and UPDATE so FRR becomes Established with your speaker and learns 192.0.2.0/24. See the README for milestones.", zh: "补上三个 build_* 函数和 main 的时序，让 r1（AS 65002）跟你的 speaker 走到 Established，并学到 192.0.2.0/24。三个里程碑写在 README 里。"}
type: code-implement
difficulty: 5
timeout: 120s
files:
  - source: src/main.c
    node: speaker
    dest: /root/src/main.c
build:
  image: gcc:13
  command: make
  output: bgp-speaker
run:
  node: speaker
  dest: /root/bgp-speaker
  stop: "sh -c 'if [ -f /tmp/bgp.pid ]; then kill $(cat /tmp/bgp.pid) 2>/dev/null; rm -f /tmp/bgp.pid; fi; true'"
  start: "sh -c 'nohup /root/bgp-speaker 10.1.12.2 >/tmp/bgp.log 2>&1 & echo $! > /tmp/bgp.pid'"
assertions:
  - name:
      en: the sentinel is removed
      zh: 占位行已删除
    type: file
    layer: control-plane
    source: src/main.c
    hint:
      en: Delete the "I AM NOT DONE" line when your implementation is ready.
      zh: 写完后把 src/main.c 第一行的 "// I AM NOT DONE" 删掉。
  - name:
      en: r1 becomes Established with the speaker
      zh: r1 和 speaker 进入 Established
    type: exec
    layer: control-plane
    node: r1
    cmd: "vtysh -c 'show bgp summary json'"
    wait: 90s
    match:
      json: "$.ipv4Unicast.peers.*.state"
      equals: "Established"
    hint:
      en: Exchange OPEN and KEEPALIVE with the peer.
      zh: 自己发 OPEN，读掉对端的 OPEN，再把 KEEPALIVE 发出去。
  - name:
      en: r1 learns 192.0.2.0/24
      zh: r1 学到 192.0.2.0/24
    type: exec
    layer: control-plane
    node: r1
    cmd: "vtysh -c 'show bgp ipv4 unicast json'"
    wait: 30s
    match:
      json: "$.totalRoutes"
      equals: "1"
    hint:
      en: Send an UPDATE with NEXT_HOP 10.1.12.1 and NLRI 192.0.2.0/24.
      zh: UPDATE 里 NEXT_HOP 填 10.1.12.1，NLRI 填 192.0.2.0/24。
  - name:
      en: r1 can ping 192.0.2.1
      zh: r1 能 ping 通 192.0.2.1
    type: exec
    layer: data-plane
    node: r1
    cmd: "ping -c 2 -W 2 192.0.2.1"
    wait: 20s
    match:
      exit_code: 0
    hint:
      en: The route must be installed; keep the session alive.
      zh: 路由得进内核转发表：会话活着，下一跳可达。
