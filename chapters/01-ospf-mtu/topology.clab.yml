name: clablings-ospf-mtu
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      exec:
        - ip addr add 10.0.1.1/30 dev eth1
        - ip link set eth1 mtu 1400 up
        - ip addr add 10.255.0.1/32 dev lo
        - sysctl -w net.ipv4.ip_forward=1
        - touch /etc/frr/frr.conf /etc/frr/vtysh.conf
        - chown frr:frr /etc/frr/frr.conf /etc/frr/vtysh.conf
        - chmod 640 /etc/frr/frr.conf /etc/frr/vtysh.conf
        - sed -i s/^ospfd=no/ospfd=yes/ /etc/frr/daemons
        - /usr/lib/frr/ospfd -d -F traditional -A 127.0.0.1
        - sleep 2
        - vtysh -c 'configure terminal' -c 'interface eth1' -c 'ip ospf network point-to-point' -c 'exit' -c 'router ospf' -c 'network 10.0.1.0/30 area 0' -c 'network 10.255.0.0/24 area 0'
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      exec:
        - ip addr add 10.0.1.2/30 dev eth1
        - ip link set eth1 mtu 1500 up
        - ip addr add 10.255.0.2/32 dev lo
        - sysctl -w net.ipv4.ip_forward=1
        - touch /etc/frr/frr.conf /etc/frr/vtysh.conf
        - chown frr:frr /etc/frr/frr.conf /etc/frr/vtysh.conf
        - chmod 640 /etc/frr/frr.conf /etc/frr/vtysh.conf
        - sed -i s/^ospfd=no/ospfd=yes/ /etc/frr/daemons
        - /usr/lib/frr/ospfd -d -F traditional -A 127.0.0.1
        - sleep 2
        - vtysh -c 'configure terminal' -c 'interface eth1' -c 'ip ospf network point-to-point' -c 'exit' -c 'router ospf' -c 'network 10.0.1.0/30 area 0' -c 'network 10.255.0.0/24 area 0'
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
