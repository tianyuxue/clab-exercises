name: clablings-ospf-mtu
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      exec:
        - ip addr add 10.0.1.1/30 dev eth1
        - ip link set eth1 mtu 1400 up
        - ip addr add 10.255.0.1/32 dev lo
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      exec:
        - ip addr add 10.0.1.2/30 dev eth1
        - ip link set eth1 mtu 1500 up
        - ip addr add 10.255.0.2/32 dev lo
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
